animations {
    enabled = yes

    bezier = easeOutQuint, 0.7, 1, 0.7, 1.5
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    # Windows: Subtle "pop-in" with a heavy focus on fading
    animation = windows, 1, 4, easeOutQuint, popin 80%
    animation = windowsIn, 1, 4, easeOutQuint, popin 80%
    animation = windowsOut, 1, 3, easeInOutCubic, popin 80%
    
    # Fade transitions: This handles the opacity changes
    animation = fade, 1, 4, easeOutQuint
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = fadeSwitch, 1, 5, easeOutQuint
    animation = fadeShadow, 1, 5, easeOutQuint
    animation = fadeDim, 1, 5, easeOutQuint

    # Borders and Misc
    animation = border, 1, 2, linear
    animation = borderangle, 1, 30, linear, loop
    
    # Workspaces: Switched from 'slide' to 'fade' for a much calmer feel
    animation = workspaces, 1, 4, easeOutQuint, fade

    # For newer Hyprland versions
    animation = workspacesIn, 1, 4, easeOutQuint, fade
    animation = workspacesOut, 1, 4, easeOutQuint, fade
}
